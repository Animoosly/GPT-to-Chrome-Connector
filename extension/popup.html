<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px Bahnschrift, "Segoe UI", system-ui, sans-serif; width: 300px; margin: 0; color: #232527; background: #efece6; }
  .hd { display: flex; align-items: center; gap: 10px; background: #2d2f32; color: #ece8e0; border-bottom: 3px solid #c9672a; padding: 0 12px 0 0; height: 40px; }
  .hd .lg { width: 40px; height: 40px; background: #c9672a; display: grid; place-items: center; }
  .hd b { font-size: 12px; letter-spacing: .14em; }
  .in { padding: 12px 14px 14px; }
  .status { display: flex; align-items: center; gap: 9px; padding: 8px 10px; background: #faf9f6; border: 1px solid #aaa395; margin-bottom: 10px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #b1afa8; flex: none; border: 1px solid rgba(0,0,0,.45); }
  .connected .dot { background: #5a8a3c; }
  .connecting .dot { background: #c8962b; }
  .disconnected .dot { background: #b0432f; }
  #state { font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 12px; }
  .detail { color: #80868c; font-size: 11px; word-break: break-all; }
  label { display: block; margin: 9px 0 3px; font-weight: 700; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; }
  input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #aaa395; background: #fff; font-family: Consolas, monospace; font-size: 12px; }
  .row { display: flex; align-items: center; gap: 7px; margin-top: 9px; font-weight: normal; font-size: 13px; letter-spacing: 0; text-transform: none; }
  .row input { accent-color: #c9672a; }
  button { margin-top: 12px; width: 100%; height: 32px; border: 1px solid #9e4f1d; border-bottom: 2px solid #7a3c15; background: #c9672a; color: #fff; font: inherit; font-weight: 700; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
  button.sec { background: #e6e1d7; color: #2d2f32; border-color: #aaa395; border-bottom-color: #8f887a; margin-top: 8px; }
  small { color: #80868c; }
</style>
</head>
<body>
  <div class="hd"><div class="lg"><svg width="20" height="20" viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="3"><path d="M4 11h17l-4-4M28 21H11l4 4"/></svg></div><b>CHROME CONNECTOR</b></div>
  <div class="in">
    <div id="status" class="status"><span class="dot"></span><div><div id="state">…</div><div id="detail" class="detail"></div></div></div>
    <label for="token">Token</label>
    <input id="token" type="password" placeholder="Auto-paired by the connector app (optional)">
    <label for="serverUrl">Server address</label>
    <input id="serverUrl" type="text">
    <label class="row"><input id="enabled" type="checkbox"> Enabled</label>
    <label class="row"><input id="allowScripts" type="checkbox"> Allow ChatGPT to run custom JavaScript</label>
    <button id="save">Save &amp; connect</button>
    <button id="panel" class="sec">Open control panel</button>
    <p><small>Keep the ChatGPT Chrome Connector app running while you use it in ChatGPT.</small></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
